<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM Info · Mudasir Database</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f33 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: rgba(20, 25, 45, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.2rem 2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(120, 180, 255, 0.15) inset;
      border: 1px solid rgba(80, 140, 255, 0.25);
      transition: all 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .header i {
      font-size: 2.4rem;
      color: #4f9eff;
      filter: drop-shadow(0 0 10px #1e4faa);
      background: rgba(30, 70, 150, 0.25);
      padding: 0.7rem;
      border-radius: 1.8rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #eef5ff;
      text-shadow: 0 2px 8px rgba(0, 40, 100, 0.8);
    }

    .header h1 span {
      font-size: 1rem;
      font-weight: 400;
      background: #254a7a;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      color: #b8d6ff;
      margin-left: 0.8rem;
      vertical-align: middle;
      border: 1px solid #3d6da0;
    }

    .badge {
      margin-left: auto;
      font-size: 0.8rem;
      background: #1e2c47;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      border: 1px solid #3165a0;
      color: #99c0ff;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge i {
      font-size: 0.8rem;
      color: #3e93ff;
      background: transparent;
      padding: 0;
      filter: none;
      text-shadow: none;
    }

    .search-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.2rem;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: #0b101f;
      border-radius: 4rem;
      padding: 0.3rem 0.3rem 0.3rem 1.5rem;
      border: 1px solid #2b3f66;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(70, 130, 255, 0.1);
    }

    .input-group:focus-within {
      border-color: #2f7bff;
      box-shadow: 0 0 0 3px rgba(47, 123, 255, 0.3), 0 8px 20px #00000070;
    }

    .input-group i {
      color: #3c7eff;
      font-size: 1.2rem;
      margin-right: 0.5rem;
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.2rem;
      padding: 0.9rem 0.5rem 0.9rem 0;
      color: #ffffff;
      letter-spacing: 0.5px;
      font-weight: 500;
      min-width: 0;
    }

    .input-group input::placeholder {
      color: #6a7fa0;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }

    .input-group button {
      background: linear-gradient(135deg, #1f5ed6, #0e3b9e);
      border: none;
      border-radius: 4rem;
      padding: 0.9rem 2rem;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #4d8cff;
      box-shadow: 0 8px 16px #0a1a3a;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .input-group button:hover {
      background: linear-gradient(135deg, #2b6ef0, #1548b0);
      transform: scale(1.01);
      box-shadow: 0 10px 22px #0b1f4b;
    }

    .input-group button:active {
      transform: scale(0.98);
    }

    .input-group button i {
      font-size: 1rem;
      color: white;
      margin: 0;
    }

    .note {
      font-size: 0.8rem;
      color: #7f94bb;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 0.8rem;
    }

    .note i {
      color: #3380ff;
      font-size: 0.75rem;
    }

    /* result container */
    .result-container {
      background: #0b111fcc;
      border-radius: 2rem;
      padding: 1.2rem 1.5rem 1.5rem;
      border: 1px solid #263b60;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 10px #00000050, 0 10px 20px #00000030;
      min-height: 210px;
      transition: all 0.2s;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f3150;
      padding-bottom: 0.75rem;
      margin-bottom: 1.2rem;
    }

    .result-header span {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6c8ec0;
    }

    .result-header .status-badge {
      background: #142b1f;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #86e0a0;
      border: 1px solid #2c7a4d;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge i {
      font-size: 0.65rem;
    }

    .record-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }

    .field {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      background: #0e1527;
      padding: 0.75rem 1rem;
      border-radius: 1.4rem;
      border-left: 4px solid #2c6ed4;
      transition: 0.15s;
      box-shadow: 0 2px 6px #00000040;
    }

    .field i {
      width: 22px;
      color: #3d82ff;
      font-size: 1.1rem;
      margin-top: 0.1rem;
      text-align: center;
    }

    .field-content {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.4rem 0.8rem;
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #7f9bcb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 70px;
    }

    .field-value {
      font-weight: 600;
      color: #eaf1ff;
      font-size: 1.05rem;
      word-break: break-word;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 4px black;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #5f7397;
      text-align: center;
      gap: 1rem;
    }

    .empty-state i {
      font-size: 2.6rem;
      color: #25427a;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 2.5rem 1rem;
      color: #7d9dd0;
    }

    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #1d3155;
      border-top: 4px solid #3b7eff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: #475e83;
      border-top: 1px solid #1d2c46;
      padding-top: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .footer a {
      color: #4c85dd;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: #ff8a8a;
      background: #2a1515;
      padding: 0.8rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .error-msg i {
      color: #ff5252;
      font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .card { padding: 1.5rem 1.2rem; }
      .header h1 { font-size: 1.5rem; }
      .badge { margin-left: 0; }
      .input-group button span { display: none; }
      .input-group button i { margin: 0; }
      .input-group button { padding: 0.9rem 1.3rem; }
      .field { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <i class="fas fa-sim-card"></i>
      <h1>SIM Info <span>Mudasir DB</span></h1>
      <div class="badge">
        <i class="fas fa-bolt"></i> Live API
      </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <div class="input-group">
        <i class="fas fa-phone-alt"></i>
        <input type="tel" id="numberInput" placeholder="e.g. 03046754893" value="03046754893" maxlength="15" autocomplete="off">
        <button id="searchBtn">
          <i class="fas fa-search"></i> <span>Search</span>
        </button>
      </div>
      <div class="note">
        <i class="fas fa-database"></i> Data fetched from Wasif Ali's public API · set via Mudasir Database
      </div>
    </div>

    <!-- Result Container -->
    <div class="result-container" id="resultContainer">
      <!-- Default: show placeholder or start state -->
      <div class="empty-state" id="emptyState">
        <i class="fas fa-id-card"></i>
        <p>Enter a mobile number &amp; press search</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span><i class="fas fa-code"></i> Developer: <strong>WASIF ALI</strong></span>
      <span>
        <i class="fab fa-telegram"></i> 
        <a href="https://t.me/+zLVbS12-FxMyMmM0" target="_blank">@FREEHACKS95</a>
      </span>
    </div>
  </div>

  <script>
    (function() {
      const API_BASE = 'https://wasifali.biz.id/public_apis/sim-info-api.php?search=';
      const numberInput = document.getElementById('numberInput');
      const searchBtn = document.getElementById('searchBtn');
      const resultContainer = document.getElementById('resultContainer');

      // Helper to show loading
      function showLoading() {
        resultContainer.innerHTML = `
          <div class="loader">
            <div class="loader-spinner"></div>
            <span>Fetching SIM details…</span>
          </div>
        `;
      }

      // Helper to show error
      function showError(message) {
        resultContainer.innerHTML = `
          <div class="error-msg">
            <i class="fas fa-exclamation-triangle"></i>
            <span>${escapeHtml(message) || 'Failed to fetch data. Check number or try again.'}</span>
          </div>
        `;
      }

      // escape HTML to prevent XSS
      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Render records beautifully
      function renderRecords(data) {
        if (!data || data.success !== true || !data.records || data.records.length === 0) {
          resultContainer.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-user-slash"></i>
              <p>No records found for this number.</p>
            </div>
          `;
          return;
        }

        const record = data.records[0]; // show first record

        // Build fields with icons
        const fieldsHtml = `
          <div class="field">
            <i class="fas fa-user"></i>
            <div class="field-content">
              <span class="field-label">Name</span>
              <span class="field-value">${escapeHtml(record.name || '—')}</span>
            </div>
          </div>
          <div class="field">
            <i class="fas fa-mobile-alt"></i>
            <div class="field-content">
              <span class="field-label">Mobile</span>
              <span class="field-value">${escapeHtml(record.mobile || '—')}</span>
            </div>
          </div>
          <div class="field">
            <i class="fas fa-id-card"></i>
            <div class="field-content">
              <span class="field-label">CNIC</span>
              <span class="field-value">${escapeHtml(record.cnic || '—')}</span>
            </div>
          </div>
          <div class="field">
            <i class="fas fa-map-pin"></i>
            <div class="field-content">
              <span class="field-label">Address</span>
              <span class="field-value">${escapeHtml(record.address || '—')}</span>
            </div>
          </div>
          <div class="field">
            <i class="fas fa-wifi"></i>
            <div class="field-content">
              <span class="field-label">Network</span>
              <span class="field-value">${escapeHtml(record.network || '—')}</span>
            </div>
          </div>
        `;

        resultContainer.innerHTML = `
          <div class="result-header">
            <span><i class="fas fa-check-circle" style="color:#2ecc71; margin-right: 5px;"></i> Record found</span>
            <div class="status-badge"><i class="fas fa-circle"></i> Active</div>
          </div>
          <div class="record-grid">
            ${fieldsHtml}
          </div>
          <div style="margin-top: 1rem; font-size: 0.7rem; color: #3f5b83; text-align: right; border-top: 1px solid #1d2c46; padding-top: 0.7rem;">
            <i class="fas fa-database"></i> Source: Wasif Ali API · Mudasir Database
          </div>
        `;
      }

      // Main fetch function
      async function fetchSimInfo(number) {
        if (!number || number.trim() === '') {
          showError('Please enter a mobile number.');
          return;
        }

        // Remove any spaces or dashes
        const cleanNumber = number.replace(/[\s\-]/g, '');
        
        showLoading();

        try {
          const url = API_BASE + encodeURIComponent(cleanNumber);
          const response = await fetch(url, {
            method: 'GET',
            headers: {
              'Accept': 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status} — ${response.statusText}`);
          }

          const data = await response.json();
          renderRecords(data);
        } catch (error) {
          console.error('Fetch error:', error);
          showError(`Network error: ${error.message}. Please try again.`);
        }
      }

      // Trigger search on button click
      searchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const number = numberInput.value.trim();
        fetchSimInfo(number);
      });

      // Trigger search on pressing Enter in input
      numberInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          const number = numberInput.value.trim();
          fetchSimInfo(number);
        }
      });

      // Auto-fetch the default number on page load (optional)
      window.addEventListener('load', function() {
        // Small delay to show UI ready
        setTimeout(() => {
          const defaultNum = numberInput.value.trim();
          if (defaultNum) {
            fetchSimInfo(defaultNum);
          }
        }, 150);
      });
    })();
  </script>
</body>
</html>
